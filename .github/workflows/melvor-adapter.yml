name: Kardii Melvor adapter checks

on:
  push:
    branches:
      - feature/kardii-general-agent
    paths:
      - 'integrations/melvor/**'
      - 'package.json'
      - '.github/workflows/melvor-adapter.yml'
  pull_request:
    paths:
      - 'integrations/melvor/**'
      - 'package.json'
      - '.github/workflows/melvor-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  melvor-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Melvor adapter unit tests
        run: npm run test:melvor
