name: Build Kardii macOS Universal App

on:
  workflow_dispatch:
  push:
    branches: ["agent/niko-workbench-v0"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos-universal:
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Verify market gateway boundary
        run: npm run test:v2.2

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build universal macOS app
        run: npm run build -- --target universal-apple-darwin --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload universal macOS app
        uses: actions/upload-artifact@v4
        with:
          name: Kardii-AI-Companion-macOS-Universal
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app