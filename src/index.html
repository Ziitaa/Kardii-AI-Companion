<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kardii</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main id="pet" aria-label="Kardii 桌宠" title="单击聊天，拖动移动，双击切换动作">
      <img id="petImage" src="./assets/pet/idle.webp" alt="Kardii">
    </main>

    <button id="agentNotice" class="agent-notice hidden" type="button" aria-live="polite">
      <span id="agentNoticeBadge">AGENT</span>
      <strong id="agentNoticeTitle">Agent 有新进展</strong>
      <small id="agentNoticeMessage">点击查看任务</small>
    </button>

    <nav id="menu" class="menu hidden" aria-label="Niko 菜单">
    <button type="button" data-action="chat">✦ 打开聊天</button>
    <button type="button" data-action="workbench">▦ Niko 控制台</button>
    <button type="button" data-action="agent">A Agent 任务</button>
    <hr>
    <button type="button" data-action="smaller">− 缩小</button>
    <button type="button" data-action="larger">＋ 放大</button>
    <hr>
    <button type="button" data-action="hide">隐藏 Niko</button>
    <button type="button" data-action="quit">退出 Niko</button>
  </nav>

    <script src="./kardii-capabilities.js"></script>
    <script src="./kardii-wecom-remote.js"></script>
    <script src="./kardii-storage.js" data-main="./main.js"></script>
  </body>
</html>
